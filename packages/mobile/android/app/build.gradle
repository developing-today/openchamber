apply plugin: 'com.android.application'

def ciVersionCode = System.getenv('OPENCHAMBER_ANDROID_VERSION_CODE')
def ciVersionName = System.getenv('OPENCHAMBER_ANDROID_VERSION_NAME')
def ciKeystorePath = System.getenv('OPENCHAMBER_ANDROID_KEYSTORE_PATH')
def ciKeystorePassword = System.getenv('OPENCHAMBER_ANDROID_KEYSTORE_PASSWORD')
def ciKeyAlias = System.getenv('OPENCHAMBER_ANDROID_KEY_ALIAS')
def ciKeyPassword = System.getenv('OPENCHAMBER_ANDROID_KEY_PASSWORD')
def hasCiSigning = ciKeystorePath && ciKeystorePassword && ciKeyAlias && ciKeyPassword
// The release build is its own app, so it installs beside the default com.openchamber.app
// (debug and CI installs) instead of replacing it. Its data, label and push identity are its own.
def releaseSuffix = '.fork'
def releasePackageName = 'com.openchamber.app' + releaseSuffix

android {
    namespace "com.openchamber.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.openchamber.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ciVersionCode ? ciVersionCode.toInteger() : 1
        versionName ciVersionName ?: "1.0"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasCiSigning) {
                storeFile file(ciKeystorePath)
                storePassword ciKeystorePassword
                keyAlias ciKeyAlias
                keyPassword ciKeyPassword
            }
        }
    }
    buildTypes {
        // A phone that got the CI release cannot take a debug-keyed APK over it
        // (signature mismatch: "App not installed"). With the same signing env as
        // release, the debug build uses the release key so `android:install` updates
        // that install in place. Without the env it stays on the debug key.
        debug {
            if (hasCiSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            applicationIdSuffix releaseSuffix
            resValue "string", "app_name", "OpenChamber Fork"
            if (hasCiSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // SealedPushMessagingService extends the push plugin's service and reads RemoteMessage,
    // which the plugin keeps as an implementation detail. Same artifact and version as the
    // plugin (firebaseMessagingVersion in variables.gradle), not a new library.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Google Services needs a client for each package in google-services.json. The release package
// has none until Firebase is set up for it (add the package there and download the file again).
// Until then the release build skips that step: it builds and installs, and push is off in it.
def servicesFile = file('google-services.json')
def servicesPackages = servicesFile.exists()
    ? new groovy.json.JsonSlurper().parse(servicesFile).client.collect { it.client_info.android_client_info.package_name }
    : []
afterEvaluate {
    if (!servicesPackages.contains(releasePackageName)) {
        tasks.matching { it.name == 'processReleaseGoogleServices' }.configureEach { enabled = false }
    }
}
