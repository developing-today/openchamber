# Thin caller for this repo's dispatch-scheduled agents: this file is
# the single home for this repo's scheduled agents, replacing the
# retired Jules scheduled tasks and the Suggestions task.
#
# This file is only a caller: the task list, slot table, and prompts
# live centrally in developing-today/code — in the reusable workflow
# .github/workflows/pm-scheduled.yml and the pm-dispatch-task prompt
# library.
#
# Schedule times are America/Chicago local times converted from CDT:
# the tasks run at 21:00 CDT (02:00 UTC) and suggestions at 09:00 CDT
# (14:00 UTC). GitHub cron is always UTC, so during CST the local fire
# time shifts one hour earlier (tasks 20:00, suggestions 08:00).
name: agents

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: Which scheduled agent task to dispatch
        type: choice
        options:
          - all
          - bolt
          - palette
          - suggestions
        default: all
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  scheduled:
    uses: developing-today/code/.github/workflows/pm-scheduled.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      schedule: ${{ github.event.schedule }}
      tasks: ${{ github.event_name == 'workflow_dispatch' && inputs.task != 'all' && inputs.task || '' }}
