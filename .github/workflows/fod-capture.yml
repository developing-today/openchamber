# THROWAWAY debug workflow (branch debug/fod-ci-capture): controlled A/B in a
# single job — build the node_modules FOD standalone, then build the full
# package, same checkout, same runner. Delete with the branch.
name: fod-capture

on:
  push:
    branches: [debug/fod-ci-capture]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Record environment and derivation paths
        run: |
          { nix --version; uname -a; nix config show; } > "$RUNNER_TEMP/env.txt" 2>&1 || true
          {
            echo "standalone fod drv: $(nix eval --raw .#packages.x86_64-linux.openchamber.node_modules.drvPath)"
            echo "full package drv:   $(nix eval --raw .#packages.x86_64-linux.openchamber.drvPath)"
          } | tee "$RUNNER_TEMP/drvs.txt"

      - name: B — build the full package (first, so its FOD build is fresh)
        id: b
        continue-on-error: true
        run: |
          set -o pipefail
          nix build .#openchamber 2>&1 | tee "$RUNNER_TEMP/b.log" || true
          grep -m1 "got:" "$RUNNER_TEMP/b.log" || echo "B: no mismatch line"

      - name: A — build the FOD standalone (same drv, fresh, B registered nothing)
        id: a
        continue-on-error: true
        run: |
          set -o pipefail
          nix build .#packages.x86_64-linux.openchamber.node_modules --print-out-paths --no-link 2>&1 | tee "$RUNNER_TEMP/a.log"
          echo "A outcome: ${PIPESTATUS[0]}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fod-ci-manifest
          path: |
            ${{ runner.temp }}/env.txt
            ${{ runner.temp }}/drvs.txt
            ${{ runner.temp }}/a.log
            ${{ runner.temp }}/b.log
