# THROWAWAY debug workflow (branch debug/fod-ci-capture): replicate the
# opencode-update workflow's build context exactly (host `bun install` in the
# checkout, then `nix build .#openchamber`) to reproduce the node_modules FOD
# hash mismatch, then capture the produced tree's per-file manifest.
# Delete with the branch.
name: fod-capture

on:
  push:
    branches: [debug/fod-ci-capture]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Record environment
        run: |
          { nix --version; uname -a; nix config show; } > "$RUNNER_TEMP/env.txt" 2>&1 || true

      - name: Build the openchamber package (clean checkout, no host install)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          nix build .#openchamber 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Rebuild FOD with the CI-observed hash and manifest it
        if: always()
        run: |
          grep -m1 "got:" "$RUNNER_TEMP/build.log" || echo "no got: line (build outcome above)"
          sed -i 's|sha256-UTeYcuNWiTMZiOHzLoGNmRj8L0Kf3CJcmr/nytukvtM=|sha256-l/YLyGlVTz60KAD9ylwVqKaN+DMxP+gAE2ba0ROvaIc=|' nix/hashes.json
          OUT=$(nix build .#packages.x86_64-linux.openchamber.node_modules --no-link --print-out-paths)
          echo "captured out: $OUT"
          cd "$OUT"
          find . -printf '%y %m %s %p %l\n' | LC_ALL=C sort > "$RUNNER_TEMP/structure.txt"
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/files.sha256"

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fod-ci-manifest
          path: |
            ${{ runner.temp }}/structure.txt
            ${{ runner.temp }}/files.sha256
            ${{ runner.temp }}/env.txt
            ${{ runner.temp }}/build.log
