name: main-broken watcher

# CI policy: .github/ci-policy.md (fleet design developing-today/code#1779
# sec.5; Phase 3, developing-today/code#1782). `pr checks` (oc-review.yml)
# is this repo's designated main-gate: watching only that one workflow
# avoids the workflow_run fan-out noise (the code#304 lesson -- watching
# "*" produced a skipped no-op run for every workflow completion).
#
# On a main-gate failure on main, this watcher computes the Breakage-ID,
# then either appends the run to the open `main-broken` issue that
# already carries that ID or files a new one with the pattern labels and
# an agent-note:v1 holder trail. Exactly one holder owns a breakage at
# any moment: Jules first (label `jules`) when this repo can actually
# run Jules, otherwise the issue is released to the Muse queue at
# filing (label `queue/queued`).
#
# JULES GAP (2026-10-29): the JULES_API_KEY secret is NOT set on
# developing-today/openchamber and this repo has no issue-labeled Jules
# job, so the Jules leg below is gated off at runtime (secret presence
# check + a jules.yml issue-labeled job must exist). Until both exist,
# every filing takes the released-to-Muse path and says so on the
# issue. Adding the secret and the job shape turns the leg on with no
# edit to this workflow.

on:
  workflow_run:
    workflows: ["pr checks"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Past main-gate run id to process (validation)"
        required: true
        type: string
      dry_run:
        description: "Compute + search only; file and comment nothing"
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read
  issues: write

# Concurrency audit (#84): triggers are workflow_run / workflow_dispatch
# only -- no issues and no pull_request_target event -- and
# cancel-in-progress is the literal `false`, so queue: max can never pair
# with a true-evaluating cancel expression here. Group is per watched
# run, so two different failures never displace each other.
concurrency:
  group: main-broken-${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
  cancel-in-progress: true
  queue: max

jobs:
  watch:
    if: >-
      github.repository == 'developing-today/openchamber' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'))
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (to detect an issue-labeled Jules job)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Append-or-file the breakage issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WATCHED_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          # Presence check only; the value is never printed (same gate
          # shape the bot workflows use for OC_REVIEW_APP_*).
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          run_id="$WATCHED_RUN_ID"
          if [ -z "$run_id" ]; then
            echo "::error::no watched run id available"
            exit 1
          fi

          run_json="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}")"
          workflow_name="$(printf '%s' "$run_json" | jq -r '.name')"
          run_url="$(printf '%s' "$run_json" | jq -r '.html_url')"
          head_sha="$(printf '%s' "$run_json" | jq -r '.head_sha')"
          head_branch="$(printf '%s' "$run_json" | jq -r '.head_branch')"
          conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion')"
          short_sha="${head_sha:0:7}"

          if [ "$conclusion" != "failure" ]; then
            echo "::notice::run ${run_id} concluded '${conclusion}', not failure; nothing to file."
            exit 0
          fi
          if [ "$head_branch" != "main" ]; then
            echo "::notice::run ${run_id} is on branch '${head_branch}', not main; nothing to file."
            exit 0
          fi

          failing_json="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100" --paginate \
            | jq -s '[.[].jobs[] | select(.conclusion == "failure") | .name] | sort | unique')"
          failing_csv="$(printf '%s' "$failing_json" | jq -r 'join(",")')"
          first_failing="$(printf '%s' "$failing_json" | jq -r '.[0] // "unknown"')"

          # Breakage-ID (design sec.5.2): first 12 hex of
          # sha256("<repo>|<workflow>|<sorted failing job names, comma-joined>").
          breakage_id="$(printf '%s' "${GH_REPO}|${workflow_name}|${failing_csv}" | sha256sum | cut -c1-12)"
          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "workflow=${workflow_name} run=${run_url} failing=[${failing_csv}] Breakage-ID=${breakage_id} dry_run=${DRY_RUN}"

          existing="$(gh issue list --state open --label main-broken \
            --search "${breakage_id} in:body" --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            append_body="$(printf 'Another failure of the same breakage.\n\n- Run: %s\n- Head commit: %s\n- Failing jobs: %s\n\nagent-note:v1 holder: chain (watcher append) at %s; holder unchanged -- see the filing note on this issue. No duplicate issue, no duplicate Jules spend.\n' \
              "$run_url" "$head_sha" "$failing_csv" "$ts")"
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN: would append to existing issue #${existing}:"
              printf '%s\n' "$append_body"
            else
              gh issue comment "$existing" --body "$append_body"
              echo "Appended run to existing breakage issue #${existing}."
            fi
            exit 0
          fi

          # Jules leg: only when Jules can actually act in this repo --
          # the secret is set, an issue-labeled job exists in jules.yml,
          # and fewer than 3 open main-broken issues already carry the
          # `jules` label (free-tier budget guard, design sec.5.2 step 3).
          jules_ready="false"
          jules_reason="JULES_API_KEY is not set on this repo and/or no issue-labeled Jules job exists"
          jules_open_count="0"
          if [ -n "${JULES_API_KEY:-}" ] && [ -f .github/workflows/jules.yml ] \
            && grep -q 'issue-labeled' .github/workflows/jules.yml; then
            jules_open_count="$(gh issue list --state open --label main-broken --label jules --json number --jq 'length')"
            if [ "$jules_open_count" -lt 3 ]; then
              jules_ready="true"
            else
              jules_reason="Jules budget guard: ${jules_open_count} open main-broken issues already carry the jules label (>= 3)"
            fi
          fi

          error_excerpt="$(gh run view "$run_id" --log-failed 2>/dev/null | head -n 40 || true)"
          if [ -z "$error_excerpt" ]; then
            error_excerpt="(failed-job log excerpt unavailable; see the run URL)"
          fi

          body_file="$RUNNER_TEMP/breakage-body.md"
          {
            echo "Main tier (the \`pr checks\` main-gate) failed on \`main\`."
            echo
            echo "- Run: ${run_url}"
            echo "- Workflow: ${workflow_name}"
            echo "- Head commit: ${head_sha}"
            echo "- Failing jobs: ${failing_csv}"
            echo "- First failing job: ${first_failing}"
            echo
            echo "Breakage-ID: ${breakage_id}"
            echo
            echo "First error excerpt (failed-job log, truncated):"
            echo
            echo '```text'
            printf '%s\n' "$error_excerpt"
            echo '```'
            echo
            echo "<!-- agent-note:v1 -->"
            echo "agent-note:v1"
            echo "holder: chain (filing)"
            echo "since: ${ts}"
            if [ "$jules_ready" = "true" ]; then
              echo "holder: jules, since ${ts} (label \`jules\` applied by the chain; open main-broken issues carrying it before filing: ${jules_open_count})"
            else
              echo "jules: skipped -- ${jules_reason}."
              echo "holder: released by chain at ${ts}, reason: jules-unavailable-or-budget; released to the Muse queue (label \`queue/queued\`). The claiming lane records the next holder transition here."
            fi
            echo
            echo "Anything that breaks main is top priority. Close this issue only when the main-gate passes on a SHA containing the fix; the \`main-broken\` label comes off only at close."
          } > "$body_file"

          title="main-broken: ${GH_REPO} ${workflow_name} @${short_sha} — ${first_failing}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: would file a new breakage issue:"
            echo "title: ${title}"
            echo "labels: kind/ci, priority/critical, main-broken, queue/queued, status/needs-triage (jules_ready=${jules_ready})"
            cat "$body_file"
            exit 0
          fi

          # Coin the pattern labels if any is missing, so filing never
          # fails on an absent label.
          for spec in 'kind/ci fbca04' 'priority/critical b60205' 'main-broken B60205' 'queue/queued 7057ff' 'status/needs-triage fbca04' 'jules 7057ff'; do
            label_name="${spec% *}"
            label_color="${spec#* }"
            encoded="$(jq -rn --arg v "$label_name" '$v | @uri')"
            if ! gh api "repos/${GH_REPO}/labels/${encoded}" >/dev/null 2>&1; then
              gh label create "$label_name" --color "$label_color" \
                --description "Coined by the main-broken watcher (fleet CI Phase 3)" || true
            fi
          done

          new_url="$(gh issue create --title "$title" --body-file "$body_file" \
            --label 'kind/ci' --label 'priority/critical' --label 'main-broken' \
            --label 'queue/queued' --label 'status/needs-triage')"
          new_number="${new_url##*/}"
          echo "Filed breakage issue #${new_number}: ${title} (${new_url})"

          if [ "$jules_ready" = "true" ]; then
            gh issue edit "$new_number" --add-label 'jules'
            echo "Applied the jules label to #${new_number} (holder: jules)."
          fi
