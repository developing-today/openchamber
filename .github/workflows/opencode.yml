name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# github.ref is the default branch for issue_comment and
# pull_request_review_comment, so a workflow+ref group is one shared
# group for every PR: with the default single queue a third bot
# command silently replaces the pending second one. Key by PR/issue
# number and queue every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
  queue: max

jobs:
  opencode:
    if: |
      !startsWith(github.event.comment.body, '/oc-review') &&
      !contains(github.event.comment.body, ' /oc-review') &&
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      # The bot needs this repository's own GitHub App. A repository
      # that has not installed it has no OC_REVIEW_APP_* secrets: detect that
      # here (the values themselves are never printed) so the command
      # skips cleanly instead of failing in its token step (#73; same gate
      # pr-review got in #62 and issue-intake got in #66).
      - name: Check bot app configuration
        id: review-app
        env:
          REVIEW_APP_ID: ${{ secrets.OC_REVIEW_APP_ID }}
          REVIEW_APP_PRIVATE_KEY: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$REVIEW_APP_ID" ] && [ -n "$REVIEW_APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::OpenChamber bot app is not configured for this repository (OC_REVIEW_APP_ID / OC_REVIEW_APP_PRIVATE_KEY secrets are unset); skipping opencode."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate bot app token
        id: app-token
        if: steps.review-app.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OC_REVIEW_APP_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}

      - name: Checkout repository
        if: steps.review-app.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run opencode
        if: steps.review-app.outputs.configured == 'true'
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # github-v1.2.19
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4-pro
