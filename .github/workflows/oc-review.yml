name: pr checks

# CI policy: .github/ci-policy.md (fleet design developing-today/code#1779
# sec.3.3/sec.3.4; Phase 2, developing-today/code#1781). This workflow is
# openchamber's designated main-gate for the Phase 3 remediation chain.
# PR tier = lint + type-check only (sub-minute execution). The full suite
# (tests + build) runs on push to main and on the nightly backstop below.
# Dedup: push is restricted to branches: [main], so a PR branch push fires
# pull_request only -- a commit never runs the same suite twice.
# MERGE REQUIREMENT (Drew, 2026-10-29): the basic tier only -- the jobs
# named "basic: lint" and "basic: type-check" below. tests/build are the
# full main tier; they are NOT a merge gate. The workflow name stays
# "pr checks" because the Phase 3 watcher (main-broken.yml) references
# it by that name.
on:
  # Merged code gets the same verification on main itself: without this, a
  # merge that breaks main is only discovered by the next PR's run.
  push:
    branches: [main]
  schedule:
    # Nightly backstop for the main tier: the full suite (including the
    # tests and build jobs that no longer run on PRs) re-runs even on
    # days with no merge, so nothing removed from PRs can vanish.
    - cron: '37 5 * * *'
  workflow_dispatch:

# A new push to the same PR makes the older run pointless. Push runs have
# no pull_request payload, so they fall back to the unique run_id (the
# label-merge-conflict pattern): every merge keeps its own run instead of
# sharing one group that a newer merge would cancel.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Four independent jobs on their own Blacksmith runners (same image as
# ubuntu-24.04, faster CPUs, colocated cache; the Blacksmith GitHub App is
# installed on the openchamber org). None of them reads another's output: the
# tests and type-check need only what `bun install` prepares (postinstall
# builds the SDK and the built-in extensions), so the wall time is the slowest
# job, not the sum.
jobs:
  type-check:
    name: "basic: type-check"
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run type-check

  lint:
    name: "basic: lint"
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Changelog outputs match their sources
        run: bun run changelog:check

  # Main tier only (Phase 2): skipped on pull_request events; runs on
  # push to main, on the nightly schedule, and on manual dispatch.
  tests:
    name: "full (main tier): tests"
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Electron Linux packaging unit tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater
          bun run test:linux-desktop

  # Main tier only (Phase 2): skipped on pull_request events; runs on
  # push to main, on the nightly schedule, and on manual dispatch.
  # Catches what type-check cannot: bundling, Vite-only syntax, the web
  # build's memory ceiling. The packages whose `build` is only a type-check (`tsc -b`)
  # (ui) or a no-op (electron) are covered by the type-check job.
  build:
    name: "full (main tier): build"
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web
        run: bun run --cwd packages/web build
      - name: Build VS Code extension
        run: bun run --cwd packages/vscode build
      - name: Prepare mobile web assets
        run: bun run --cwd packages/mobile build:assets

  # On failure of any main job above, hand the failure to the central
  # pm-dispatch ci-fix task (developing-today/code#2672). The wrapper is
  # best-effort only: continue-on-error keeps a dispatch problem from
  # masking the real CI result.
  ci-fix:
    needs: [type-check, lint, tests, build]
    if: failure()
    permissions:
      id-token: write
      issues: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: developing-today/code/.github/actions/pm-dispatch-ci-fix@main
        continue-on-error: true
        env:
          GH_TOKEN: "${{ github.token }}"
