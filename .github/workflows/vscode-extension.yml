name: Publish VS Code Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# CI policy: .github/ci-policy.md (fleet design developing-today/code#1779;
# Phase 1 code#1780, Phase 2 code#1781, Phase 3 code#1782).
# Concurrency (design sec.4): releases are never cancelled. Tag pushes and
# manual dispatches each get a per-run group (run_id); any other ref-keyed
# run cancels on supersede. Triggers are push/workflow_dispatch only: no
# issues/pull_request_target event and no queue: max, so the #84
# validation trap cannot occur here.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))) && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build VS Code extension
        run: bun run --cwd packages/vscode build

      - name: Package extension
        run: cd packages/vscode && bunx vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: cd packages/vscode && bunx vsce publish -p "$VSCE_PAT" --no-dependencies

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: bunx ovsx publish packages/vscode/*.vsix -p "$OVSX_PAT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openchamber-vscode-vsix
          path: packages/vscode/*.vsix

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: packages/vscode/*.vsix
          generate_release_notes: false
          # The release workflow publishes the release once every platform is
          # on it; uploading here must not publish the draft early.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
