name: bot-help

on:
  issue_comment:
    types: [created]

# github.ref is the default branch for issue_comment, so a
# workflow+ref group is one shared group for every issue: with the
# default single queue a third help command silently replaces the
# pending second one. Key by issue and queue every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false
  queue: max

jobs:
  help:
    timeout-minutes: 10
    if: github.event.comment.user.login != 'openchamber-bot[bot]' && (github.event.comment.body == '@openchamber-bot help' || startsWith(github.event.comment.body, '@openchamber-bot help '))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # The bot needs this repository's own GitHub App. A repository
      # that has not installed it has no OC_REVIEW_APP_* secrets: detect that
      # here (the values themselves are never printed) so the help command
      # skips cleanly instead of failing in its token step (#73; same gate
      # pr-review got in #62 and issue-intake got in #66).
      - name: Check bot app configuration
        id: review-app
        env:
          REVIEW_APP_ID: ${{ secrets.OC_REVIEW_APP_ID }}
          REVIEW_APP_PRIVATE_KEY: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$REVIEW_APP_ID" ] && [ -n "$REVIEW_APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::OpenChamber bot app is not configured for this repository (OC_REVIEW_APP_ID / OC_REVIEW_APP_PRIVATE_KEY secrets are unset); skipping bot help."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate bot app token
        id: app-token
        if: steps.review-app.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OC_REVIEW_APP_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}

      - name: Acknowledge help command
        id: reaction
        if: steps.review-app.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          reaction_id="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='eyes' \
            --jq '.id')"

          echo "reaction_id=$reaction_id" >> "$GITHUB_OUTPUT"

      - name: Post help
        if: steps.review-app.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EYES_REACTION_ID: ${{ steps.reaction.outputs.reaction_id }}
        run: |
          first_line="${COMMENT_BODY%%$'\n'*}"

          case "$first_line" in
            "@openchamber-bot help"|"@openchamber-bot help "*)
              ;;
            *)
              echo "Unsupported help command: $first_line" >&2
              exit 1
              ;;
          esac

          gh issue comment "$ISSUE_NUMBER" --body "<h3>OpenChamber Bot Commands</h3>

          Use one command at the start of a comment. Any text after the command is passed as maintainer focus. Commands run only for people with write access to this repository.

          - <code>@openchamber-bot review [focus]</code> — review a pull request.
          - <code>@openchamber-bot summarize [focus]</code> — summarize an issue or pull request discussion.
          - <code>@openchamber-bot triage [focus]</code> — triage an issue.
          - <code>@openchamber-bot reproduce [focus]</code> — trace an issue's cause in the code.
          - <code>@openchamber-bot help</code> — show this help message.

          <h4>Examples</h4>

          - <code>@openchamber-bot review please check the latest fix</code>
          - <code>@openchamber-bot summarize focus on unresolved blockers</code>
          - <code>@openchamber-bot triage this looks like a Windows desktop regression</code>
          - <code>@openchamber-bot reproduce try the steps from the latest reporter comment</code>"

          if [ -n "$EYES_REACTION_ID" ]; then
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions/${EYES_REACTION_ID}"
          fi

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='+1' >/dev/null
