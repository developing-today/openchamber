name: Jules Daily Upstream Sync (OpenChamber)

# Daily automated upstream sync, conflict resolution, feature-opportunity triage,
# and safe merging for developing-today/openchamber, run by an OpenCode
# session launched through pm-dispatch (developing-today/code#2672).

on:
  schedule:
    # Run daily at 04:30 UTC
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Automatically merge the PR if all tests and validation pass"
        type: boolean
        default: true
      create_feature_issues:
        description: "Analyze new upstream features and file GitHub issues for adoption opportunities"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  queue: max

jobs:
  daily-upstream-sync:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Dispatch the upstream sync via pm-dispatch
        uses: developing-today/code/.github/actions/pm-dispatch-start@main
        with:
          title: "chore: daily upstream sync from openchamber/openchamber"
          prompt: >-
            Perform the daily upstream sync of OpenChamber from upstream openchamber/openchamber (branch `main`) into `main`.

            Follow these strict requirements and principles:

            ### 1. UPSTREAM TRACKING POLICY
            - Track upstream `main` into our `main` branch: `git fetch upstream main && git merge --no-ff upstream/main`.

            ### 2. CONFLICT RESOLUTION & CAPABILITY PRESERVATION RULES
            - **Preserve All Features**: Keep all features, tools, custom settings, and routes from BOTH sides:
              - Retain fork-specific controls (`openchamber.routing.plans.actionSendMode`, `autoCreateWorktree`, `agentTerminalsPlacement`, persistent terminal keys, and JIT secrets).
              - Retain custom release channels, draft release uploads, and worktree-by-default session creation.
            - **No Deprecations**: If upstream removed an API, feature, parameter, or route that our fork uses or provides, DO NOT remove it on our side. We want more capabilities and features in general.
            - **Reduce Future Conflicts**: Where appropriate, isolate fork additions and extensions into separate/modular files (`packages/web/server/lib/routing/`, `packages/ui/src/lib/routing/`, dedicated i18n modules) so future merges conflict less often.
            - **Complete i18n & RTL Parity**: Ensure full key parity across all 15 locales (including Arabic `ar` and Hebrew `he` RTL). If new keys were added upstream or in fork features, provide valid English fallback entries across dictionaries so `src/lib/i18n/messages.test.ts` passes with zero missing keys.

            ### 3. FEATURE OPPORTUNITY TRIAGE & ISSUE CREATION
            - Inspect the newly merged upstream commits (`git log ... --grep="^feat"`).
            - Identify if any new upstream capabilities, refactors, or UI surfaces could be adopted or built upon by our fork's additions (such as interactive render pages, project knowledge plans, model routing tiers, or plan cost tracking).
            - For each identified high-value synergy, create a comprehensive GitHub issue using `gh issue create --repo developing-today/openchamber` containing:
              - Clear title and summary
              - Upstream commit references
              - Architectural context and user story
              - Concrete technical specifications and relevant file paths
              - Complete acceptance criteria
              (Ensure enough detail that a brand-new agent with zero prior context can implement it).

            ### 4. VALIDATION & TESTING
            - Run UI typecheck: `bun run type-check:ui`.
            - Run i18n key parity test: `bun test src/lib/i18n/messages.test.ts` (in `packages/ui`).
            - Run Plans UI tests: `env NODE_ENV=development bun test src/components/sections/routing/PlansSection.test.tsx` (in `packages/ui`).
            - Run routing server vitest suite: `npx vitest run server/lib/routing/` (in `packages/web`).
            - Verify that all tests that weren't already failing continue to pass, and all newly merged tests pass.

            ### 5. PULL REQUEST & SAFE MERGE
            - Update the `README.md` fork notice with the latest upstream commit SHA and timestamp.
            - Open a clean, conflict-free Pull Request detailing all merged upstream commits and resolved conflicts.
            - Merge the PR into `main` only when you are reasonably certain it is correct: tests pass cleanly, there are no regressions, and the sync is conflict-free. Merging is permitted, never required — when any of that is uncertain, leave the PR open and state your confidence and what a human should check in the description.

      - name: Find an open sync failure issue
        id: failure-issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          title="chore(deps): automated upstream sync failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --limit 100 --json number,title | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          if [ -n "${number}" ]; then
            echo "An open sync failure issue already exists: #${number}"
          else
            echo "No open sync failure issue."
          fi

      - name: Queue the sync failure on the existing tracker via pm-dispatch
        if: failure() && steps.failure-issue.outputs.number != ''
        uses: developing-today/code/.github/actions/pm-dispatch-queue@main
        with:
          title: "chore(deps): automated upstream sync failing"
          prompt: |
            Upstream sync failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The daily upstream sync is dispatched to an OpenCode session via pm-dispatch, so a failed run means the sync could not be completed. Please triage and land the sync.
          issue_number: ${{ steps.failure-issue.outputs.number }}

      - name: Queue the sync failure via pm-dispatch (new tracker)
        if: failure() && steps.failure-issue.outputs.number == ''
        uses: developing-today/code/.github/actions/pm-dispatch-queue@main
        with:
          title: "chore(deps): automated upstream sync failing"
          prompt: |
            The daily upstream-sync workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The sync is dispatched to an OpenCode session via pm-dispatch, so a workflow failure means the sync could not be completed (an unresolvable merge conflict, a dispatch failure, or a failed validation after its PR). Per Drew's escalation chain (2026-10-28), the fleet queue takes over from here: reproduce the upstream merge in a laptop worktree, resolve conflicts preserving both sides' features per the workflow prompt, verify, and land the sync as a PR. This issue is maintained by the jules-daily-upstream-sync workflow: repeat failures queue a follow-up task on this same issue instead of opening a duplicate; close it once a sync run succeeds.
          issue: "true"

      - name: Close the sync failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          title="chore(deps): automated upstream sync failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list --state open --search "\"$title\" in:title" --limit 100 --json number,title | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)
          if [ -n "${number}" ]; then
            gh issue close "${number}" --comment "Upstream sync succeeded: ${run_url}. Closing as promised in the tracking issue body; a later failure will open a fresh tracking issue."
          fi
