name: Jules Daily Upstream Sync (OpenChamber)

# Daily automated upstream sync, conflict resolution, feature-opportunity triage,
# and safe merging for developing-today/openchamber using Google Jules.

on:
  schedule:
    # Run daily at 04:30 UTC
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Automatically merge the PR if all tests and validation pass"
        type: boolean
        default: true
      create_feature_issues:
        description: "Analyze new upstream features and file GitHub issues for adoption opportunities"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-upstream-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Jules Upstream Sync Agent
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          include_commit_log: true
          prompt: >-
            Perform the daily upstream sync of OpenChamber from upstream openchamber/openchamber (branch `main`) into `main`.

            Follow these strict requirements and principles:

            ### 1. UPSTREAM TRACKING POLICY
            - Track upstream `main` into our `main` branch: `git fetch upstream main && git merge --no-ff upstream/main`.

            ### 2. CONFLICT RESOLUTION & CAPABILITY PRESERVATION RULES
            - **Preserve All Features**: Keep all features, tools, custom settings, and routes from BOTH sides:
              - Retain fork-specific controls (`openchamber.routing.plans.actionSendMode`, `autoCreateWorktree`, `agentTerminalsPlacement`, persistent terminal keys, and JIT secrets).
              - Retain custom release channels, draft release uploads, and worktree-by-default session creation.
            - **No Deprecations**: If upstream removed an API, feature, parameter, or route that our fork uses or provides, DO NOT remove it on our side. We want more capabilities and features in general.
            - **Reduce Future Conflicts**: Where appropriate, isolate fork additions and extensions into separate/modular files (`packages/web/server/lib/routing/`, `packages/ui/src/lib/routing/`, dedicated i18n modules) so future merges conflict less often.
            - **Complete i18n & RTL Parity**: Ensure full key parity across all 15 locales (including Arabic `ar` and Hebrew `he` RTL). If new keys were added upstream or in fork features, provide valid English fallback entries across dictionaries so `src/lib/i18n/messages.test.ts` passes with zero missing keys.

            ### 3. FEATURE OPPORTUNITY TRIAGE & ISSUE CREATION
            - Inspect the newly merged upstream commits (`git log ... --grep="^feat"`).
            - Identify if any new upstream capabilities, refactors, or UI surfaces could be adopted or built upon by our fork's additions (such as interactive render pages, project knowledge plans, model routing tiers, or plan cost tracking).
            - For each identified high-value synergy, create a comprehensive GitHub issue using `gh issue create --repo developing-today/openchamber` containing:
              - Clear title and summary
              - Upstream commit references
              - Architectural context and user story
              - Concrete technical specifications and relevant file paths
              - Complete acceptance criteria
              (Ensure enough detail that a brand-new agent with zero prior context can implement it).

            ### 4. VALIDATION & TESTING
            - Run UI typecheck: `bun run type-check:ui`.
            - Run i18n key parity test: `bun test src/lib/i18n/messages.test.ts` (in `packages/ui`).
            - Run Plans UI tests: `env NODE_ENV=development bun test src/components/sections/routing/PlansSection.test.tsx` (in `packages/ui`).
            - Run routing server vitest suite: `npx vitest run server/lib/routing/` (in `packages/web`).
            - Verify that all tests that weren't already failing continue to pass, and all newly merged tests pass.

            ### 5. PULL REQUEST & SAFE MERGE
            - Update the `README.md` fork notice with the latest upstream commit SHA and timestamp.
            - Open a clean, conflict-free Pull Request detailing all merged upstream commits and resolved conflicts.
            - If tests pass cleanly and there are no regressions, proceed to merge the PR into `main`.
