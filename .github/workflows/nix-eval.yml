# Manual-only check that catches anything that breaks the flake's
# evaluation: when dispatched upstream, it evaluates every package.
# It does not run on pull_request or push, so it does not gate a
# merge. In this repository the eval job is skipped (gated below to
# openchamber/openchamber), so a dispatch here validates nothing
# until the flakes are reconciled. Read-only: no builds, no cache,
# no write permissions.
name: nix-eval

on:
  workflow_dispatch:

# CI policy: .github/ci-policy.md (fleet design developing-today/code#1779;
# Phase 1 code#1780, Phase 2 code#1781, Phase 3 code#1782).
# Concurrency (design sec.4): runs are ref-keyed and cancel on
# supersede. Trigger is workflow_dispatch only: no push, pull_request,
# issues, or pull_request_target event and no queue: max, so the #84
# validation trap cannot occur here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    # This fork keeps its own flake (aarch64-darwin app, dev shells, the
    # developing-today/opencode input), which has none of the outputs this job
    # evaluates or re-bakes. Runs only upstream until the flakes are reconciled.
    if: github.repository == 'openchamber/openchamber'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate the flake's outputs
        run: |
          nix eval --raw .#openchamber.drvPath
          nix eval --raw .#openchamber-desktop.drvPath
          nix eval --raw .#opencode-cli.drvPath
          nix eval --raw .#openchamber.bunDeps.drvPath
          nix eval --raw .#opencode-cli.node_modules.drvPath
          nix flake check --no-build
