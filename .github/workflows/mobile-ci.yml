name: Mobile Smoke Build

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Also build the iOS simulator app on a macOS runner. Off by default: Android is the target.'
        required: false
        default: false
        type: boolean

concurrency:
  group: mobile-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    timeout-minutes: 60
    name: Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: bun install

      - name: Lint mobile package
        run: bun run lint:mobile

      - name: Build Android debug APK
        run: bun run mobile:build:android:debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openchamber-android-debug-apk
          path: packages/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios-simulator:
    timeout-minutes: 60
    name: iOS simulator app
    if: ${{ inputs.build_ios }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Build iOS simulator app
        run: bun run mobile:build:ios:simulator
